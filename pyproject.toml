[project]
name = "foundry-bridge"
version = "0.2.0"
description = "Local bridge between scripts and a FoundryVTT world open in the GM's browser"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9"]

[project.scripts]
foundry-bridge = "foundry_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_bridge"]
